# Ossian login theme.
#
# Extends keycloak.v2 rather than replacing it. Keycloak's login pages cover a long tail of
# flows — OTP, WebAuthn, recovery codes, consent, expired links — and a from-scratch theme
# silently breaks the ones nobody remembers to test until a user hits them. Inheriting means
# only the appearance changes, and every flow keeps working.
parent=keycloak.v2
import=common/keycloak

# `styles` replaces the parent's value rather than adding to it, so the parent sheet has to be
# named again here or the whole PatternFly layout is lost.
styles=css/styles.css css/ossian.css
