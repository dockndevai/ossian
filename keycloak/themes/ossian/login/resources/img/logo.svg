<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Ossian: a corpus in strata, cut by a question, with the retrieved passage solid across it. -->
  <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="32" height="32">
    <rect width="32" height="32" fill="#fff"/>
    <rect x="13.7" y="-1" width="4.6" height="34" fill="#000"/>
    <rect x="13.7" y="17.2" width="4.6" height="3.5" fill="#fff"/>
  </mask>
  <g mask="url(#cut)">
    <circle cx="16" cy="16" r="12.4" fill="none" stroke="#4f46e5" stroke-width="2.7"
            stroke-linecap="round" stroke-dasharray="7.21 2.53" stroke-dashoffset="3.6"
            opacity="0.62"/>
    <rect x="8.4" y="17.2" width="15.2" height="3.5" rx="1.75" fill="#4f46e5"/>
  </g>
</svg>
