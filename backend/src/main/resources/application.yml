server:
  # Kept off 8080 so this runs beside the gateway and anything else local.
  port: 8081

spring:
  application:
    name: ossian

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:ossian}
    username: ${DB_USER:ossian}
    password: ${DB_PASSWORD:ossian}
    hikari:
      maximum-pool-size: 15

  jpa:
    hibernate:
      # Flyway owns the schema. Hibernate must never touch it, or the two disagree silently.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.batch_size: 25

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB

  security:
    oauth2:
      resourceserver:
        jwt:
          # Keycloak realm. Signature, issuer and expiry are validated here; what a token is
          # allowed to do is decided by roles and the tenant claim.
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/ossian}

  ai:
    openai:
      # Points at spring-llm-gateway, which is OpenAI-compatible. Swap for Ollama or a cloud
      # endpoint by changing this one URL; nothing else in the app knows the difference.
      # 8090 is where docker-compose.yml publishes the gateway, not the gateway's own 8080.
      base-url: ${LLM_BASE_URL:http://localhost:8090}
      api-key: ${LLM_API_KEY:sk-demo-local-key}
      chat:
        options:
          # 3b is the smallest size that reliably answers *from* the retrieved passage. 0.5b
          # retrieves fine but then contradicts the text it was given, which reads as a RAG bug
          # and isn't one.
          model: ${LLM_CHAT_MODEL:qwen2.5:3b}
          temperature: 0.1
      embedding:
        options:
          # Must match ossian.vectorstore dimensions below. nomic-embed-text is 768.
          model: ${LLM_EMBED_MODEL:nomic-embed-text}
    vectorstore:
      pgvector:
        initialize-schema: true
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        # MUST equal the embedding model's output size. A mismatch fails at insert time with a
        # dimension error, which is the good case; the bad case is silently poor retrieval.
        dimensions: ${LLM_EMBED_DIMENSIONS:768}

ossian:
  ingest:
    chunk-size: 1200
    chunk-overlap: 200
    max-file-size: 26214400
    embedding-batch-size: 25
  retrieval:
    top-k: 6
    similarity-threshold: 0.5
    cache-seconds: 300
  chat:
    model: ${LLM_CHAT_MODEL:qwen2.5:3b}
    temperature: 0.1
    max-tokens: 800
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://localhost:4173

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ossian

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    io.github.dockndevai.ossian: INFO
    org.springframework.ai: INFO
