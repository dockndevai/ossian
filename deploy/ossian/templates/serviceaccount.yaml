{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ossian.serviceAccountName" . }}
  labels: {{- include "ossian.labels" . | nindent 4 }}
# Ossian talks to no Kubernetes API, so the pod has no use for a mounted token — and a token it
# does not need is a credential an attacker inside the container does.
automountServiceAccountToken: false
{{- end }}
