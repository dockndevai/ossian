apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ossian.fullname" . }}
  labels: {{- include "ossian.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels: {{- include "ossian.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels: {{- include "ossian.selectorLabels" . | nindent 8 }}
      annotations:
        # Roll the pods when configuration changes. Without this a `helm upgrade` that only edits
        # the ConfigMap leaves every pod running the old values and reports success.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}{{- toYaml . | nindent 8 }}{{- end }}
    spec:
      serviceAccountName: {{ include "ossian.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      # Ingestion runs asynchronously and a batch can take minutes. Long enough to finish the
      # document in flight; the alternative is a rollout that leaves half-embedded documents
      # marked PROCESSING with nothing to mark them failed.
      terminationGracePeriodSeconds: 120
      containers:
        - name: backend
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: {{ include "ossian.fullname" . }}
          env:
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.existingSecret }}
                  key: {{ .Values.postgres.passwordKey }}
            - name: SPRING_AI_OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.gateway.existingSecret }}
                  key: {{ .Values.gateway.apiKeyKey }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # The JVM and Tika both write temporary files; a read-only root needs somewhere to
            # put them, and Tika fails on large PDFs without it.
            - name: tmp
              mountPath: /tmp
          # Liveness deliberately checks only that the process is answering. Pointing it at a
          # health group that includes the database turns a brief Postgres blip into every pod
          # being killed at once, which is the outage the probe was meant to prevent.
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 4
          # Readiness does include dependencies: a pod that cannot reach Postgres should stop
          # taking traffic without being restarted.
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          # Flyway runs at startup and the first migration on an empty database is slow. A
          # startup probe gives it room without loosening liveness for the rest of the pod's life.
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 5
            failureThreshold: 60
          resources: {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
