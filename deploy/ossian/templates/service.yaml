apiVersion: v1
kind: Service
metadata:
  name: {{ include "ossian.fullname" . }}
  labels: {{- include "ossian.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 8081
      targetPort: http
      name: http
  selector: {{- include "ossian.selectorLabels" . | nindent 4 }}
{{- if .Values.frontend.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ossian.fullname" . }}-web
  labels: {{- include "ossian.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      name: http
  selector:
    {{- include "ossian.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: web
{{- end }}
