<!doctype html><meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1500px; height:750px; background:#f7f7f8; overflow:hidden;
         font-family:Inter,-apple-system,system-ui,sans-serif; color:#18181b; }
  .wrap { padding:80px 88px; height:100%; display:flex; flex-direction:column; }
  .mark { display:flex; align-items:center; gap:14px; color:#4f46e5; }
  .mark span { font-size:23px; font-weight:700; color:#18181b; letter-spacing:-.01em; }
  h1 { font-size:88px; line-height:1.02; letter-spacing:-.034em; font-weight:700; margin-top:34px; }
  h1 em { font-style:normal; color:#4f46e5; }
  .sub { margin-top:22px; font-size:27px; color:#71717a; line-height:1.4; max-width:26em; }
  .head { display:flex; justify-content:space-between; align-items:flex-end; }
  /* The refusal is the product's actual thesis, so it earns the empty right-hand side. */
  .quote { max-width:340px; border-left:3px solid #4f46e5; padding-left:20px; margin-bottom:6px; }
  .quote p { font-size:20px; line-height:1.45; color:#3f3f46; font-style:italic; }
  .quote span { display:block; margin-top:10px; font-size:14px; color:#a1a1aa;
                font-family:'JetBrains Mono',monospace; }
  /* The bar is the argument: a sliver of demo, and everything else. */
  .bar { margin-top:76px; display:flex; height:66px; border-radius:11px; overflow:hidden;
         box-shadow:0 2px 0 rgba(0,0,0,.03); }
  .seg { display:flex; align-items:center; justify-content:center; font-size:17px; font-weight:600;
         white-space:nowrap; }
  .demo { width:10%; background:#4f46e5; color:#fff; }
  .rest { flex:1; display:flex; }
  .rest div { flex:1; background:#fff; border-right:1px solid #e4e4e7; color:#52525b;
              display:flex; align-items:center; justify-content:center; font-size:17px;
              padding:0 10px; white-space:nowrap; }
  .rest div:last-child { border-right:none; }
  .legend { display:flex; margin-top:15px; font-size:15px; color:#a1a1aa;
            font-family:'JetBrains Mono',monospace; }
  .legend .a { width:10%; color:#4f46e5; font-weight:500; }
  .legend .b { flex:1; }
</style>
<div class="wrap">
  <div class="mark">
    <svg width="34" height="34" viewBox="0 0 32 32" fill="none">
      <mask id="c" maskUnits="userSpaceOnUse" x="0" y="0" width="32" height="32">
        <rect width="32" height="32" fill="#fff"/>
        <rect x="13.7" y="-1" width="4.6" height="34" fill="#000"/>
        <rect x="13.7" y="17.2" width="4.6" height="3.5" fill="#fff"/>
      </mask>
      <g mask="url(#c)">
        <circle cx="16" cy="16" r="12.4" stroke="currentColor" stroke-width="2.7" stroke-linecap="round"
                stroke-dasharray="7.21 2.53" stroke-dashoffset="3.6" opacity=".62"/>
        <rect x="8.4" y="17.2" width="15.2" height="3.5" rx="1.75" fill="currentColor"/>
      </g>
    </svg>
    <span>Ossian</span>
  </div>

  <div class="head">
    <div>
      <h1>The boring<br><em>90%</em> of RAG</h1>
      <div class="sub">A retrieval system is a weekend to demo<br>and a quarter to operate.</div>
    </div>
    <div class="quote">
      <p>“I could not find anything about that in your documents.”</p>
      <span>the feature, not the failure</span>
    </div>
  </div>

  <div class="bar">
    <div class="seg demo">the demo</div>
    <div class="rest">
      <div>ingestion</div>
      <div>retrieval you can inspect</div>
      <div>machine credentials</div>
      <div>rate limits</div>
      <div>observability</div>
      <div>audit</div>
    </div>
  </div>
  <div class="legend"><span class="a">10%</span><span class="b">90%</span></div>
</div>
