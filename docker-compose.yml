# Local infrastructure for Openbook.
#
#   docker compose up -d
#   docker compose exec ollama ollama pull nomic-embed-text
#   docker compose exec ollama ollama pull qwen2.5:0.5b
#
# Ports deliberately avoid the defaults so this can run beside other local services
# (spring-llm-gateway on 8080, a native postgres on 5432, a native redis on 6379).
services:
  postgres:
    # pgvector build of Postgres: the extension is present, so Flyway's CREATE EXTENSION works.
    image: pgvector/pgvector:pg17
    container_name: openbook-postgres
    environment:
      POSTGRES_DB: openbook
      POSTGRES_USER: openbook
      POSTGRES_PASSWORD: openbook
    ports:
      - "5433:5432"
    volumes:
      - openbook-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openbook -d openbook"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: openbook-redis
    ports:
      - "6380:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: openbook-keycloak
    # Imports a ready-made realm so auth works on first boot: no manual clicking to create
    # a realm, client, roles, tenant mapper and test users.
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8180:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # The LLM gateway. Openbook speaks the OpenAI protocol to this, and it owns routing,
  # virtual keys, per-tenant token quotas, usage metering and failover -- so Openbook holds
  # no upstream model credentials of its own.
  #
  # Build the image once from https://github.com/dockndevai/spring-llm-gateway:
  #     docker build -t spring-llm-gateway:0.1.0 .
  # Or set LLM_BASE_URL=http://ollama:11434 on the backend to cut it out entirely.
  llm-gateway:
    image: spring-llm-gateway:0.1.0
    container_name: openbook-llm-gateway
    depends_on:
      ollama:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      # Inside the compose network the backends are service names, not localhost.
      LLM_OLLAMA_URI: http://ollama:11434
      LLM_VLLM_URI: http://vllm-not-present:8000
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      # Small budget by default so a runaway ingestion is capped rather than unbounded.
      LLM_GATEWAY_AUTH_KEYS_DEMO_TOKENS_PER_MINUTE: "500000"
    ports:
      - "8090:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s

  # Models behind the gateway.
  ollama:
    image: ollama/ollama:latest
    container_name: openbook-ollama
    ports:
      - "11435:11434"
    volumes:
      - openbook-ollama:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  openbook-pgdata:
  openbook-ollama:
